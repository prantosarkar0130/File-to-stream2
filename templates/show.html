<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream & Download</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: radial-gradient(circle at top, #1a1a2e, #16213e); color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; }
        .btn-gradient { background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%); transition: 0.3s; }
        .btn-gradient:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(79, 172, 254, 0.5); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="glass max-w-lg w-full p-8 text-center">
        <div class="mb-6">
            <i class="fa-solid fa-circle-play text-6xl text-blue-400"></i>
        </div>

        <!-- new ui design kora  -->
        <h1 id="fileName" class="text-xl font-bold mb-2 truncate px-4">Loading File...</h1>
        <p id="fileSize" class="text-gray-400 mb-8">Size: -- MB</p>

        <div class="space-y-4">
            <a id="vlcLink" href="#" class="flex items-center justify-center gap-3 w-full py-3 px-6 glass hover:bg-white/10 transition rounded-xl">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e6/VLC_Icon.svg" class="w-6 h-6"> Play in VLC Player
            </a>
            <a id="mxLink" href="#" class="flex items-center justify-center gap-3 w-full py-3 px-6 glass hover:bg-white/10 transition rounded-xl">
                <img src="https://play-lh.googleusercontent.com/97yXmYt76BvC_S-FmPqS5nE5f2e8Yh9Y9Y9Y9Y9" class="w-6 h-6 rounded"> Play in MX Player
            </a>
            
            <hr class="border-white/10 my-6">

            <a id="dlLink" href="#" class="btn-gradient flex items-center justify-center gap-3 w-full py-4 px-6 rounded-xl font-bold text-lg text-slate-900">
                <i class="fa-solid fa-download"></i> Download Fast
            </a>
        </div>
        <p class="mt-8 text-xs text-gray-500 italic">Powered by Sharing Box Bot</p>
    </div>

    <script>
        const uid = window.location.pathname.split('/').pop();
        fetch(`/api/file/${uid}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('fileName').innerText = data.file_name;
                document.getElementById('fileSize').innerText = 'Size: ' + data.file_size;
                document.getElementById('dlLink').href = data.direct_dl_link;
                document.getElementById('vlcLink').href = data.vlc_player_link;
                document.getElementById('mxLink').href = data.mx_player_link;
            })
            .catch(err => {
                document.getElementById('fileName').innerText = "File Not Found!";
                console.error(err);
            });
    </script>
</body>
</html>
